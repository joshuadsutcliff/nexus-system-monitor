[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-collectors-macos",
    "crates/nexus-collectors-linux",
    "crates/nexus-collectors-windows",
    "crates/nexus-disk",
    "crates/nexus-automation",
    "crates/nexus-ui",
    "crates/nexus-cli",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Josh Sutcliff"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
compact_str = { version = "0.8", features = ["serde"] }
bitflags = { version = "2.6", features = ["serde"] }
parking_lot = "0.12"
smallvec = { version = "1.13", features = ["serde"] }
tokio = { version = "1.40", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
libc = "0.2"
mach2 = "0.4"
core-foundation-sys = "0.8"
libloading = "0.8"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rayon = "1.10"
walkdir = "2.5"
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
wgpu = "30.0"
winit = "0.30"
cosmic-text = "0.15"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37" }
png = "0.18"
tray-icon = "0.26"
nexus-core = { path = "crates/nexus-core" }
nexus-collectors-macos = { path = "crates/nexus-collectors-macos" }
nexus-collectors-linux = { path = "crates/nexus-collectors-linux" }
nexus-collectors-windows = { path = "crates/nexus-collectors-windows" }
nexus-disk = { path = "crates/nexus-disk" }
nexus-automation = { path = "crates/nexus-automation" }
nexus-ui = { path = "crates/nexus-ui" }
