name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Rust CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package macOS .app bundle
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh

      - name: Package Linux release tarball
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - name: Upload macOS release bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-system-monitor-macos
          path: target/release/bundle/Nexus System Monitor.app

      - name: Upload Linux release tarball
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-system-monitor-linux
          path: target/release/bundle/*.tar.gz

      - name: Upload Windows release binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-system-monitor-windows
          path: |
            target/release/nexus-monitor.exe
            target/release/nexus-gui.exe
            target/release/nexus.exe
            target/release/nexus-cli.exe
            README.md
            LICENSE
