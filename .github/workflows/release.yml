name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.0)'
        required: false
        default: '0.8.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Test Suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace

  build-windows:
    name: Package Windows (x64 + ARM64)
    needs: build-test
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.event.inputs.version || '0.8.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain (x64 + ARM64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows x64 release binaries
        run: cargo build --release --target x86_64-pc-windows-msvc -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Build Windows ARM64 release binaries
        run: cargo build --release --target aarch64-pc-windows-msvc -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Stage Windows x64 and ARM64 UI and CLI directories
        shell: pwsh
        run: |
          $pairs = @(
            @{ Arch = "win-x64"; Target = "x86_64-pc-windows-msvc" },
            @{ Arch = "win-arm64"; Target = "aarch64-pc-windows-msvc" }
          )
          foreach ($p in $pairs) {
            $arch = $p.Arch
            $rel = "target/$($p.Target)/release"
            $uiDir = "dist/stage/$arch-ui"
            $cliDir = "dist/stage/$arch-cli"
            New-Item -ItemType Directory -Force -Path "$uiDir/Resources/Skins" | Out-Null
            New-Item -ItemType Directory -Force -Path $cliDir | Out-Null

            Copy-Item "$rel/nexus-monitor.exe" "$uiDir/nexus-monitor.exe" -Force
            Copy-Item "$rel/nexus-monitor.exe" "$uiDir/NexusMonitor.exe" -Force
            Copy-Item "$rel/nexus-gui.exe"     "$uiDir/nexus-gui.exe" -Force
            Copy-Item "crates/nexus-ui/assets/AppIcon.png" "$uiDir/Resources/AppIcon.png" -Force
            Copy-Item "crates/nexus-ui/assets/fonts/Michroma-Regular.ttf" "$uiDir/Resources/Michroma-Regular.ttf" -Force
            Copy-Item "crates/nexus-ui/assets/fonts/LED Dot-Matrix.ttf" "$uiDir/Resources/LED Dot-Matrix.ttf" -Force
            Copy-Item "crates/nexus-ui/assets/skins/*" "$uiDir/Resources/Skins/" -Recurse -Force
            Copy-Item "README.md" "$uiDir/README.md" -Force
            Copy-Item "LICENSE"   "$uiDir/LICENSE" -Force

            Copy-Item "$rel/nexus.exe"     "$cliDir/nexus.exe" -Force
            Copy-Item "$rel/nexus-cli.exe" "$cliDir/nexus-cli.exe" -Force
            Copy-Item "README.md" "$cliDir/README.md" -Force
            Copy-Item "LICENSE"   "$cliDir/LICENSE" -Force
          }

      - name: Sign Windows binaries (Authenticode)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on this runner image." }
          $targets = @(
            "dist/stage/win-x64-ui/nexus-monitor.exe",
            "dist/stage/win-x64-ui/NexusMonitor.exe",
            "dist/stage/win-arm64-ui/nexus-monitor.exe",
            "dist/stage/win-arm64-ui/NexusMonitor.exe",
            "dist/stage/win-x64-cli/nexus.exe",
            "dist/stage/win-arm64-cli/nexus.exe"
          )
          foreach ($target in $targets) {
            & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $target" }
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Create portable ZIP archives
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path dist/out | Out-Null
          Compress-Archive -Path dist/stage/win-x64-ui/*   -DestinationPath "dist/out/NexusMonitor-Windows-Portable-$v.zip" -Force
          Compress-Archive -Path dist/stage/win-arm64-ui/* -DestinationPath "dist/out/NexusMonitor-Windows-ARM-Portable-$v.zip" -Force
          Compress-Archive -Path dist/stage/win-x64-cli/*  -DestinationPath "dist/out/NexusCLI-Windows-$v.zip" -Force
          Compress-Archive -Path dist/stage/win-arm64-cli/* -DestinationPath "dist/out/NexusCLI-Windows-ARM-$v.zip" -Force

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-Item "C:\Program Files (x86)\Inno Setup*\iscc.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Item "C:\Program Files (x86)\Inno Setup*\iscc.exe" | Select-Object -First 1
          }
          $isccPath = if ($iscc -is [System.IO.FileInfo]) { $iscc.FullName } else { $iscc.Source }
          & $isccPath installer\windows\NexusMonitor.iss `
            /DAppVersion=$v /DAppArch=x64 `
            "/DPublishDir=..\..\dist\stage\win-x64-ui" `
            "/DCliPublishDir=..\..\dist\stage\win-x64-cli" `
            /DOutputDir=..\..\dist\out `
            "/DOutputFilename=NexusMonitor-Windows-Installer-$v"
          & $isccPath installer\windows\NexusMonitor.iss `
            /DAppVersion=$v /DAppArch=arm64 `
            "/DPublishDir=..\..\dist\stage\win-arm64-ui" `
            "/DCliPublishDir=..\..\dist\stage\win-arm64-cli" `
            /DOutputDir=..\..\dist\out `
            "/DOutputFilename=NexusMonitor-Windows-ARM-Installer-$v"

      - name: Sign Windows installers (Authenticode)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "windows-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          $installers = @(
            "dist/out/NexusMonitor-Windows-Installer-$v.exe",
            "dist/out/NexusMonitor-Windows-ARM-Installer-$v.exe"
          )
          foreach ($target in $installers) {
            & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $target" }
          }
          Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/out/*

  build-macos:
    name: Package macOS (Apple Silicon + Intel)
    needs: build-test
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.event.inputs.version || '0.8.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build macOS Apple Silicon (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Build macOS Intel (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Install create-dmg
        run: brew install create-dmg || true

      - name: Import signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build .dmg and .tar.gz packages
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dist/out dist/cli-arm64 dist/cli-x64

          cp target/aarch64-apple-darwin/release/nexus dist/cli-arm64/nexus
          cp target/aarch64-apple-darwin/release/nexus-cli dist/cli-arm64/nexus-cli
          cp README.md LICENSE dist/cli-arm64/
          chmod +x dist/cli-arm64/nexus dist/cli-arm64/nexus-cli

          cp target/x86_64-apple-darwin/release/nexus dist/cli-x64/nexus
          cp target/x86_64-apple-darwin/release/nexus-cli dist/cli-x64/nexus-cli
          cp README.md LICENSE dist/cli-x64/
          chmod +x dist/cli-x64/nexus dist/cli-x64/nexus-cli

          bash installer/macos/create-app-bundle.sh osx-arm64 "$V" dist/out dist/cli-arm64/nexus target/aarch64-apple-darwin/release
          bash installer/macos/create-app-bundle.sh osx-x64   "$V" dist/out dist/cli-x64/nexus   target/x86_64-apple-darwin/release

          tar -czf "dist/out/NexusCLI-MacOS-${V}.tar.gz" -C dist/cli-arm64 .
          tar -czf "dist/out/NexusCLI-MacOS-Intel-${V}.tar.gz" -C dist/cli-x64 .

      - name: Notarize and staple DMGs
        if: env.MACOS_CERT_P12_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          for DMG in "dist/out/NexusMonitor-MacOS-${V}.dmg" "dist/out/NexusMonitor-MacOS-Intel-${V}.dmg"; do
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$DMG"
          done

      - name: Clean up signing keychain
        if: always() && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "${SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${SIGNING_KEYCHAIN}" || true
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: dist/out/*

  build-linux-x64:
    name: Package Linux x64 (AppImage, .deb, Portable, CLI)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.event.inputs.version || '0.8.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            file \
            libfuse2 \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Linux x64 release binaries
        run: cargo build --release -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Stage and package Linux x64 artifacts
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dist/out dist/stage/linux-x64-ui/Resources/Skins dist/stage/linux-x64-cli

          cp target/release/nexus-monitor dist/stage/linux-x64-ui/nexus-monitor
          cp target/release/nexus-gui     dist/stage/linux-x64-ui/nexus-gui
          chmod +x dist/stage/linux-x64-ui/nexus-monitor dist/stage/linux-x64-ui/nexus-gui
          ln -s nexus-monitor dist/stage/linux-x64-ui/NexusMonitor
          cp crates/nexus-ui/assets/AppIcon.png dist/stage/linux-x64-ui/Resources/AppIcon.png
          cp crates/nexus-ui/assets/fonts/Michroma-Regular.ttf dist/stage/linux-x64-ui/Resources/Michroma-Regular.ttf
          cp "crates/nexus-ui/assets/fonts/LED Dot-Matrix.ttf" "dist/stage/linux-x64-ui/Resources/LED Dot-Matrix.ttf"
          cp -R crates/nexus-ui/assets/skins/* dist/stage/linux-x64-ui/Resources/Skins/
          cp README.md LICENSE dist/stage/linux-x64-ui/

          cp target/release/nexus     dist/stage/linux-x64-cli/nexus
          cp target/release/nexus-cli dist/stage/linux-x64-cli/nexus-cli
          chmod +x dist/stage/linux-x64-cli/nexus dist/stage/linux-x64-cli/nexus-cli
          cp README.md LICENSE dist/stage/linux-x64-cli/

          tar -czf "dist/out/NexusMonitor-Linux-Portable-${V}.tar.gz" -C dist/stage/linux-x64-ui .
          tar -czf "dist/out/NexusCLI-Linux-${V}.tar.gz"              -C dist/stage/linux-x64-cli .

          bash installer/linux/create-appimage.sh "$V" dist/out dist/stage/linux-x64-ui
          bash installer/linux/create-deb.sh      "$V" dist/out dist/stage/linux-x64-cli dist/stage/linux-x64-ui

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: dist/out/*

  build-linux-arm64:
    name: Package Linux ARM64 (Portable + CLI)
    needs: build-test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${{ github.event.inputs.version || '0.8.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libvulkan-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Linux ARM64 release binaries
        run: cargo build --release -p nexus-ui --bin nexus-monitor --bin nexus-gui -p nexus-cli --bin nexus --bin nexus-cli

      - name: Stage and package Linux ARM64 artifacts
        run: |
          V="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dist/out dist/stage/linux-arm64-ui/Resources/Skins dist/stage/linux-arm64-cli

          cp target/release/nexus-monitor dist/stage/linux-arm64-ui/nexus-monitor
          cp target/release/nexus-gui     dist/stage/linux-arm64-ui/nexus-gui
          chmod +x dist/stage/linux-arm64-ui/nexus-monitor dist/stage/linux-arm64-ui/nexus-gui
          ln -s nexus-monitor dist/stage/linux-arm64-ui/NexusMonitor
          cp crates/nexus-ui/assets/AppIcon.png dist/stage/linux-arm64-ui/Resources/AppIcon.png
          cp crates/nexus-ui/assets/fonts/Michroma-Regular.ttf dist/stage/linux-arm64-ui/Resources/Michroma-Regular.ttf
          cp "crates/nexus-ui/assets/fonts/LED Dot-Matrix.ttf" "dist/stage/linux-arm64-ui/Resources/LED Dot-Matrix.ttf"
          cp -R crates/nexus-ui/assets/skins/* dist/stage/linux-arm64-ui/Resources/Skins/
          cp README.md LICENSE dist/stage/linux-arm64-ui/

          cp target/release/nexus     dist/stage/linux-arm64-cli/nexus
          cp target/release/nexus-cli dist/stage/linux-arm64-cli/nexus-cli
          chmod +x dist/stage/linux-arm64-cli/nexus dist/stage/linux-arm64-cli/nexus-cli
          cp README.md LICENSE dist/stage/linux-arm64-cli/

          tar -czf "dist/out/NexusMonitor-Linux-ARM-Portable-${V}.tar.gz" -C dist/stage/linux-arm64-ui .
          tar -czf "dist/out/NexusCLI-Linux-ARM-${V}.tar.gz"              -C dist/stage/linux-arm64-cli .

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: dist/out/*

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets
          pattern: "*-artifacts"

      - name: Verify all 18 release assets
        run: |
          ls -lh release-assets/
          COUNT=$(find release-assets -maxdepth 1 -type f | wc -l)
          echo "Total release assets: ${COUNT}"
          if [[ "${COUNT}" -lt 18 ]]; then
            echo "::error::Expected 18 release assets, found ${COUNT}"
            exit 1
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "${TAG_NAME}" != v* ]]; then
            TAG_NAME="v${{ github.event.inputs.version || '0.8.0' }}"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Nexus System Monitor $TAG_NAME" \
              --generate-notes \
              $(find release-assets -maxdepth 1 -type f | sort | tr '\n' ' ')
          fi
